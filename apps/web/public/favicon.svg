<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" rx="64" fill="url(#bgGrad)"/>
  
  <!-- Subtle top right glow -->
  <circle cx="256" cy="0" r="180" fill="url(#glowGrad)" opacity="0.4"/>
  
  <!-- Group for the V shape -->
  <g transform="translate(128, 200)">
    <!-- Left Stroke -->
    <g transform="rotate(-35)">
      <rect x="-18" y="-120" width="36" height="120" rx="18" fill="url(#leftGrad)"/>
    </g>
    <!-- Right Stroke -->
    <g transform="rotate(35)">
      <rect x="-22" y="-150" width="44" height="150" rx="22" fill="url(#rightGrad)"/>
    </g>
  </g>
  
  <!-- Accent Dot -->
  <circle cx="80" cy="80" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="80" cy="80" r="8" fill="#ffffff"/>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#022c22"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="256" cy="0" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftGrad" x1="0" y1="-120" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="0" y2="-150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="glow" x="20" y="20" width="120" height="120" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
</svg>
